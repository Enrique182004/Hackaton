<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .c { fill: none; stroke: #7ffcff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .w { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .f { fill: #7ffcff; stroke: none; }
      .a { fill: none; stroke: #ffb347; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .af { fill: #ff6b4a; stroke: none; }
      .s { fill: #ffffff; stroke: none; }
    </style>
  </defs>

  <!-- 0 idle -->
  <g filter="url(#glow)" transform="translate(0,0)">
