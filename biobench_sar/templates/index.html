<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="proj.title">Whiteboard Assistant – projector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-projector-width="{{ projector_width }}" data-projector-height="{{ projector_height }}">
  {# The ink the latest answer is about: a glowing outline around it, drawn by main.js. #}
  <div id="highlight" class="hidden" aria-hidden="true"></div>
  <div id="avatar" class="state-idle" aria-hidden="true">
    <div id="bubble" class="hidden"></div>
  </div>

  <div id="status" data-state="idle">
    <span class="ring"></span>
    <span class="dots"><i></i><i></i><i></i></span>
    <span id="status-label" data-i18n="conn.connecting">Connecting…</span>
  </div>
  <div id="transcript" class="hidden"></div>
  <div id="problem-card" class="hidden">
    <span id="problem-card-label"></span>
    <span id="problem-card-text"></span>
  </div>

  <div id="text-overlay" class="hidden">
    <input id="text-input" type="text" placeholder="Type a question, Enter to send, Esc to cancel" data-i18n-placeholder="proj.typePlaceholder" autocomplete="off">
  </div>

  <div id="debug" class="hidden">
    <div id="debug-conn" data-i18n="proj.debug.connecting">socket: connecting</div>
    <pre id="debug-event" data-i18n="proj.debug.noEvents">(no events yet)</pre>
  </div>
  <div id="crosshair" class="hidden"></div>

  <script src="{{ url_for('static', filename='js/vendor/socket.io.min.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
