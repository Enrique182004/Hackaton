name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (PortAudio for pyaudio, Tesseract for OCR tests)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev tesseract-ocr
      - name: Python packages
        # CPU-only torch keeps the install small; tests never touch a GPU.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
