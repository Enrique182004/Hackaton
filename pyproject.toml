[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["biobench_sar/static", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",    # long lines are handled by the formatter; prompts/strings may exceed it
  "RUF001",  # prompts intentionally contain unicode (°, –)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
